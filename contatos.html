<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Viaje+</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="index.html">Início</a>
        <a href="Galeria.html">Galeria</a>
        <a href="Contatos.html">Contatos</a>
    </nav>

    <main class="pagina-contato">
        <h1>Entre em contato</h1>
        <p>Conte para nós qual destino você gostaria de conhecer!</p>

        <form>
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Digite seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email"
                   placeholder="seuemail@exemplo.com" required>

            <label for="destino">Destino desejado</label>
            <select id="destino" name="destino" required>
                <option value="">Escolha um destino</option>
                <option value="rio">Rio de Janeiro</option>
                <option value="chile">Chile</option>
                <option value="peru">Peru</option>
                <option value="argentina">Argentina</option>
                <option value="colombia">Colômbia</option>
                <option value="outro">Outro destino</option>
            </select>

            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem"
                      placeholder="Conte como podemos ajudar..."
                      rows="5" required></textarea>

            <button type="submit">Enviar mensagem</button>
        </form>
    </main>

    <footer class="rodape">
        <h3>Viaje+</h3>
        <p>Descubra o mundo. Viva novas histórias.</p>
        <p>© 2026 Viaje+. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
